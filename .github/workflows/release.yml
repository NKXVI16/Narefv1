name: Release Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0). Leave empty for a build-only run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VERSION" ]]; then
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build add-in for Revit 2024
        run: dotnet build revit-addin/NarefDataExporter -c Release -p:RevitVersion=2024 -p:Version=${{ steps.ver.outputs.version }} -o revit-addin/installer/Setup/payload/2024

      - name: Build add-in for Revit 2025
        run: dotnet build revit-addin/NarefDataExporter -c Release -p:RevitVersion=2025 -p:Version=${{ steps.ver.outputs.version }} -o revit-addin/installer/Setup/payload/2025

      - name: Stage add-in manifest
        run: Copy-Item revit-addin/NarefDataExporter.addin revit-addin/installer/Setup/payload/

      - name: Build installer
        run: dotnet build revit-addin/installer/Setup -c Release -p:Version=${{ steps.ver.outputs.version }} -o out/installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NarefDataExporterSetup
          path: out/installer/NarefDataExporterSetup.exe

      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: >
          gh release create "v$env:VERSION"
          out/installer/NarefDataExporterSetup.exe
          --target "$env:GITHUB_SHA"
          --title "NAref Data Exporter v$env:VERSION"
          --generate-notes
